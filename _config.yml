# Jekyll settings for scepticsdesk.com (GitHub Pages builds this automatically).
# If the repo already has a _config.yml, merge these keys into it instead.
title: "The Sceptic’s Desk"
url: "https://scepticsdesk.com"
timezone: Europe/London
markdown: kramdown

# Each Weekly Brief lives at scepticsdesk.com/brief/<slug>/
permalink: /brief/:title/

# Briefs dated in the future stay hidden until a later build.
future: false

exclude:
  - README-weekly-brief.md

analytics:
  ga4_id: "G-4Z41BMWQQX"          # GA4 → Admin → Data streams → Measurement ID
  meta_pixel_id: ""               # Meta Events Manager → dataset/pixel ID (digits only)
  x_pixel_id: ""                  # X Ads → Events manager → pixel ID
  x_lead_event_id: ""             # X Ads → your Lead event, format tw-xxxxx-xxxxx
  privacy_url: "/privacy.html"        # where the banner's privacy link points

plugins:
  - jekyll-sitemap                # merge into your existing plugins list if you have one
